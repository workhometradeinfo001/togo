name: Docker-build

on:
 workflow_run:
  workflows:
   - togo-front-end-build
  types:
   - completed

jobs:
  build-docker:
   runs-on: ubuntu-latest     
   if: ${{ github.event.workflow_run.conclusion == 'success' }}
   steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Get Full Image Name
      run: echo "FULL_IMAGE_NAME=${{secrets.ACR_LOGIN_SERVER}}/${{secrets.DOCKER_IMAGE_NAME}}:${{github.sha}}" >> $GITHUB_ENV

    - name: Build docker file
      run: docker build \
        --build-arg VITE_CLOUD_HOST=${{ secrets.VITE_CLOUD_HOST }} \
        -t $FULL_IMAGE_NAME . 

    - name: Login into Azure Registry
      uses: docker/login-action@v4
      with:
        registry: ${{secrets.ACR_LOGIN_SERVER}}
        username: ${{secrets.ACR_USERNAME}}
        password: ${{secrets.ACR_PASSWORD}}

    - name: Push image into Azure
      run: docker push $FULL_IMAGE_NAME


            
        
