name: Docker-build

on:
  workflow_run:
    workflows:
      - togo-front-end-build
    types:
      - completed

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      # 1. Login to Azure FIRST via OIDC
      - name: Login into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Login to ACR natively without admin credentials
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # 3. Construct Tag Name
      - name: Get Full Image Name
        run: |
          echo "FULL_IMAGE_NAME=${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

      # 4. Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg VITE_CLOUD_HOST=${{ secrets.VITE_CLOUD_HOST }} \
            -t $FULL_IMAGE_NAME .
          docker push $FULL_IMAGE_NAME

      # 5. Create Azure Container Apps Environment if missing
      - name: Ensure Container App Environment Exists
        run: |
          if az containerapp env show --name togo-environment --resource-group ${{ secrets.ACR_RESOURCE_GROUP }} > /dev/null 2>&1; then
            echo "Environment exists, skipping creation."
          else 
            echo "Environment doesn't exist, creating..."
            az containerapp env create \
              --name togo-environment \
              --resource-group ${{ secrets.ACR_RESOURCE_GROUP }} \
              --location southeastasia
          fi

      # 6. Deploy / Update Container App
      - name: Deploy to Azure Container App
        run: |
          az containerapp up \
            --name fron-end-react-container \
            --resource-group ${{ secrets.ACR_RESOURCE_GROUP }} \
            --environment togo-environment \
            --location southeastasia \
            --image $FULL_IMAGE_NAME \
            --target-port 5173 \
            --ingress external \
            --env-vars VITE_CLOUD_HOST=${{ secrets.VITE_CLOUD_HOST }}

      